<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Three ways in to one API, in one cluster</title>
  <desc id="d">Case 1: two bare-metal hosts each take traffic on their own external IP. Case 2: two LAN hosts take traffic on their internal IPs from a load balancer that holds the LAN's one shared external IP. Case 3: one LAN host takes traffic on its internal IP from the LAN only. All five nginx silos reach the same api silo by name over the mesh.</desc>
  <defs>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f2b45a"/></marker>
    <marker id="mv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8f7bff"/></marker>
    <marker id="mm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5ef0c0"/></marker>
  </defs>
  <style>
    .mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
    .h{fill:#eef0f5;font-size:13.5px;font-weight:600}
    .s{fill:#aab0bd;font-size:12px}
    .k{font-size:10.5px;font-weight:600}
    .v{fill:#eef0f5;font-size:12.5px}
    .c{fill:#eef0f5;font-size:15px;font-weight:600}
  </style>
  <rect width="1280" height="920" rx="14" fill="#0d1017"/>
  <text x="30" y="40" fill="#eef0f5" font-size="18" font-weight="600">Three ways in to one API, in one cluster</text>
  <text x="30" y="62" class="s">Every ingress here is a plain nginx silo. What changes is which host address its port asks for, and what sits in front.</text>

  <!-- case titles -->
  <text x="46" y="100" class="c"><tspan fill="#f2b45a">1</tspan>  Its own external IP</text>
  <text x="470" y="100" class="c"><tspan fill="#f2b45a">2</tspan>  One shared external IP</text>
  <text x="914" y="100" class="c"><tspan fill="#8f7bff">3</tspan>  Internal only</text>

  <!-- clients -->
  <rect x="76" y="116" width="290" height="50" rx="9" fill="#141822" stroke="#f2b45a"/>
  <text x="221" y="137" fill="#eef0f5" font-size="13" font-weight="600" text-anchor="middle">anyone</text>
  <text x="221" y="155" class="s mono" text-anchor="middle">api.example.com</text>
  <rect x="500" y="116" width="290" height="50" rx="9" fill="#141822" stroke="#f2b45a"/>
  <text x="645" y="137" fill="#eef0f5" font-size="13" font-weight="600" text-anchor="middle">anyone</text>
  <text x="645" y="155" class="s mono" text-anchor="middle">office.example.com</text>
  <text x="221" y="186" class="s" text-anchor="middle">DNS: two A records, one per host</text>
  <text x="645" y="186" class="s" text-anchor="middle">DNS: one A record, the shared address</text>

  <!-- ===== bare metal ===== -->
  <rect x="30" y="206" width="382" height="330" rx="12" fill="#11151e" stroke="#2a3040" stroke-dasharray="6 5"/>
  <g>
    <rect x="46" y="264" width="170" height="220" rx="10" fill="#141822" stroke="#2a3040"/>
    <text x="58" y="287" class="h">host ovh-1</text>
    <rect x="58" y="298" width="146" height="42" rx="7" fill="#1b2130" stroke="#f2b45a"/>
    <text x="68" y="314" class="k" fill="#f2b45a">EXTERNAL IP</text><text x="68" y="331" class="v mono">51.38.10.20</text>
    <rect x="58" y="352" width="146" height="118" rx="9" fill="#0d1017" stroke="#5ef0c0"/>
    <text x="68" y="373" fill="#eef0f5" font-size="12.5" font-weight="600">nginx-public-0</text>
    <text x="68" y="396" class="s mono" font-size="11.5">80, 443</text>
    <text x="68" y="414" class="s mono" font-size="11.5">hostPort:</text>
    <text x="68" y="430" class="s mono" font-size="11.5">  [external]</text>
    
    <text x="68" y="456" class="mono" fill="#f2b45a" font-size="11.5">51.38.10.20:443</text>
  </g>
  <g>
    <rect x="226" y="264" width="170" height="220" rx="10" fill="#141822" stroke="#2a3040"/>
    <text x="238" y="287" class="h">host ovh-2</text>
    <rect x="238" y="298" width="146" height="42" rx="7" fill="#1b2130" stroke="#f2b45a"/>
    <text x="248" y="314" class="k" fill="#f2b45a">EXTERNAL IP</text><text x="248" y="331" class="v mono">51.38.10.21</text>
    <rect x="238" y="352" width="146" height="118" rx="9" fill="#0d1017" stroke="#5ef0c0"/>
    <text x="248" y="373" fill="#eef0f5" font-size="12.5" font-weight="600">nginx-public-1</text>
    <text x="248" y="396" class="s mono" font-size="11.5">80, 443</text>
    <text x="248" y="414" class="s mono" font-size="11.5">hostPort:</text>
    <text x="248" y="430" class="s mono" font-size="11.5">  [external]</text>
    
    <text x="248" y="456" class="mono" fill="#f2b45a" font-size="11.5">51.38.10.21:443</text>
  </g>

  <!-- ===== LAN ===== -->
  <rect x="440" y="206" width="810" height="330" rx="12" fill="#11151e" stroke="#2a3040" stroke-dasharray="6 5"/>
  <rect x="456" y="218" width="378" height="56" rx="9" fill="#1b2130" stroke="#f2b45a"/>
  <text x="470" y="240" fill="#eef0f5" font-size="13" font-weight="600">load balancer</text>
  <text x="820" y="240" class="v mono" text-anchor="end">203.0.113.7</text>
  <text x="470" y="260" class="s" font-size="11.5">holds the LAN's one <tspan fill="#f2b45a" font-weight="600">external IP</tspan>; sends to internal IPs</text>
  <g>
    <rect x="466" y="304" width="170" height="180" rx="10" fill="#141822" stroke="#2a3040"/>
    <text x="478" y="327" class="h">host lan-1</text>
    <rect x="478" y="338" width="146" height="42" rx="7" fill="#1b2130" stroke="#8f7bff"/>
    <text x="488" y="354" class="k" fill="#8f7bff">INTERNAL IP</text><text x="488" y="371" class="v mono">192.168.1.11</text>
    <rect x="478" y="392" width="146" height="78" rx="9" fill="#0d1017" stroke="#5ef0c0"/>
    <text x="488" y="413" fill="#eef0f5" font-size="12.5" font-weight="600">nginx-lan-0</text>
    <text x="488" y="434" class="s mono" font-size="11.5">443  hostPort:</text>
    <text x="488" y="452" class="s mono" font-size="11.5">     [internal]</text>
  </g>
  <g>
    <rect x="654" y="304" width="170" height="180" rx="10" fill="#141822" stroke="#2a3040"/>
    <text x="666" y="327" class="h">host lan-2</text>
    <rect x="666" y="338" width="146" height="42" rx="7" fill="#1b2130" stroke="#8f7bff"/>
    <text x="676" y="354" class="k" fill="#8f7bff">INTERNAL IP</text><text x="676" y="371" class="v mono">192.168.1.12</text>
    <rect x="666" y="392" width="146" height="78" rx="9" fill="#0d1017" stroke="#5ef0c0"/>
    <text x="676" y="413" fill="#eef0f5" font-size="12.5" font-weight="600">nginx-lan-1</text>
    <text x="676" y="434" class="s mono" font-size="11.5">443  hostPort:</text>
    <text x="676" y="452" class="s mono" font-size="11.5">     [internal]</text>
  </g>

  <!-- case 3 -->
  <path d="M868 216V526" stroke="#2a3040" stroke-dasharray="3 5"/>
  <rect x="900" y="218" width="334" height="56" rx="9" fill="#141822" stroke="#8f7bff"/>
  <text x="1067" y="240" fill="#eef0f5" font-size="13" font-weight="600" text-anchor="middle">someone on the LAN</text>
  <text x="1067" y="260" class="s mono" text-anchor="middle">tools.corp.example.com</text>
  <g>
    <rect x="900" y="304" width="334" height="180" rx="10" fill="#141822" stroke="#2a3040"/>
    <text x="912" y="327" class="h">host lan-3</text>
    <rect x="912" y="338" width="310" height="42" rx="7" fill="#1b2130" stroke="#8f7bff"/>
    <text x="922" y="354" class="k" fill="#8f7bff">INTERNAL IP</text><text x="1212" y="364" class="v mono" text-anchor="end">192.168.1.13</text>
    <rect x="912" y="392" width="310" height="78" rx="9" fill="#0d1017" stroke="#5ef0c0"/>
    <text x="922" y="413" fill="#eef0f5" font-size="12.5" font-weight="600">nginx-internal</text>
    <text x="922" y="434" class="s mono" font-size="11.5">443  hostPort: [internal]</text>
    <text x="922" y="454" class="s" font-size="11.5">Nothing in front: only the LAN reaches it.</text>
  </g>

  <!-- ===== api ===== -->
  <rect x="450" y="596" width="380" height="110" rx="10" fill="#0d1017" stroke="#5ef0c0" stroke-width="2"/>
  <text x="466" y="620" fill="#eef0f5" font-size="14" font-weight="600">silo api</text>
  <text x="814" y="620" class="s" text-anchor="end">on any host in the cluster</text>
  <text x="466" y="642" class="s mono" fill="#5ef0c0">api.payments.kevaso</text>
  <text x="466" y="666" class="s mono">8080  no hostPort: silos only</text>
  <text x="466" y="690" class="s">allowFrom: the three ingress controllers</text>

  <!-- to the api -->
  <path d="M131 470V566H520V594" stroke="#5ef0c0" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#mm)"/>
  <path d="M311 470V566" stroke="#5ef0c0" stroke-width="1.8" stroke-dasharray="6 4" fill="none"/>
  <path d="M551 470V552H640V594" stroke="#5ef0c0" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#mm)"/>
  <path d="M739 470V552H640" stroke="#5ef0c0" stroke-width="1.8" stroke-dasharray="6 4" fill="none"/>
  <path d="M1067 470V566H760V594" stroke="#5ef0c0" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#mm)"/>
  <text x="150" y="586" fill="#5ef0c0" font-size="12">by name, over the mesh</text>
  <text x="880" y="586" fill="#5ef0c0" font-size="12">by name, over the mesh</text>

  <!-- group labels -->
  <text x="46" y="524" class="s" font-weight="600" stroke="#11151e" stroke-width="7" paint-order="stroke">BARE METAL · set nginx-public</text>
  <text x="456" y="524" class="s" font-weight="600" stroke="#11151e" stroke-width="7" paint-order="stroke">A LAN · set nginx-lan · no host here has an external IP</text>
  <text x="900" y="524" class="s" font-weight="600" stroke="#11151e" stroke-width="7" paint-order="stroke">SAME LAN · silo nginx-internal</text>

  <!-- in -->
  <path d="M200 192C200 240 186 250 186 296" stroke="#f2b45a" stroke-width="1.8" fill="none" marker-end="url(#ma)"/>
  <path d="M250 192C250 240 366 250 366 296" stroke="#f2b45a" stroke-width="1.8" fill="none" marker-end="url(#ma)"/>
  <path d="M645 192V216" stroke="#f2b45a" stroke-width="1.8" fill="none" marker-end="url(#ma)"/>
  <path d="M590 274V336" stroke="#8f7bff" stroke-width="1.8" fill="none" marker-end="url(#mv)"/>
  <path d="M778 274V336" stroke="#8f7bff" stroke-width="1.8" fill="none" marker-end="url(#mv)"/>
  <path d="M1180 274V336" stroke="#8f7bff" stroke-width="1.8" fill="none" marker-end="url(#mv)"/>

  <!-- table -->
  <g>
    <text x="30" y="744" fill="#eef0f5" font-size="13" font-weight="600">Side by side</text>
    <g class="s" font-weight="600">
      <text x="30" y="768">CASE</text><text x="250" y="768">THE PORT ASKS FOR</text><text x="440" y="768">IN FRONT</text><text x="730" y="768">WHO CAN REACH IT</text><text x="980" y="768">YOUR DNS</text>
    </g>
    <path d="M30 776H1250" stroke="#2a3040"/>
    <g class="s">
      <text x="30" y="798"><tspan fill="#f2b45a">1</tspan>  Its own external IP</text><text x="250" y="798" class="s mono">hostPort: [external]</text><text x="440" y="798">nothing</text><text x="730" y="798">anyone</text><text x="980" y="798">one A record per host</text>
      <text x="30" y="822"><tspan fill="#f2b45a">2</tspan>  One shared external IP</text><text x="250" y="822" class="s mono">hostPort: [internal]</text><text x="440" y="822">a balancer holding the external IP</text><text x="730" y="822">anyone, through the balancer</text><text x="980" y="822">one A record, the balancer's</text>
      <text x="30" y="846"><tspan fill="#8f7bff">3</tspan>  Internal only</text><text x="250" y="846" class="s mono">hostPort: [internal]</text><text x="440" y="846">nothing</text><text x="730" y="846">machines on that network</text><text x="980" y="846">a record in the LAN's own DNS</text>
    </g>
  </g>

  <rect x="30" y="866" width="1220" height="34" rx="9" fill="#141822" stroke="#5ef0c0"/>
  <text x="48" y="888" fill="#eef0f5" font-size="13" font-weight="600">One mesh across every host</text>
  <text x="250" y="888" class="s">It's how each nginx reaches the api. In case 2 the balancer can be yours, or a provider's kept in step by a plugin (a Linode NodeBalancer in front of Linodes).</text>
</svg>
