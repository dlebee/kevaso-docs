<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Addresses in a Kevaso cluster</title>
  <desc id="d">Two hosts. Each has an internal IP that you set, an optional external IP that you set, and a mesh IP that Kevaso assigns. Each silo has a cluster IP and a name. A port is reachable from other silos only, unless it asks for a host port on the host's internal or external IP.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#aab0bd"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5ef0c0"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8f7bff"/></marker>
  </defs>
  <rect width="980" height="640" rx="14" fill="#0d1017"/>

  <!-- who reaches what -->
  <text x="150" y="38" fill="#aab0bd" font-size="13" text-anchor="middle">from outside its network</text>
  <path d="M150 46V92" stroke="#f2b45a" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="330" y="38" fill="#aab0bd" font-size="13" text-anchor="middle">machines on its network</text>
  <path d="M330 46V92" stroke="#8f7bff" stroke-width="1.6" marker-end="url(#av)"/>
  <text x="820" y="38" fill="#aab0bd" font-size="13" text-anchor="middle">machines on its network</text>
  <path d="M820 46V92" stroke="#8f7bff" stroke-width="1.6" marker-end="url(#av)"/>

  <!-- host 1 -->
  <rect x="30" y="100" width="450" height="400" rx="12" fill="#141822" stroke="#2a3040"/>
  <text x="50" y="158" fill="#eef0f5" font-size="15" font-weight="600">host ovh-1</text>
  <rect x="70" y="86" width="160" height="42" rx="8" fill="#1b2130" stroke="#f2b45a"/>
  <text x="150" y="104" fill="#f2b45a" font-size="11" text-anchor="middle" font-weight="600">EXTERNAL IP · you set it</text>
  <text x="150" y="120" fill="#eef0f5" font-size="13" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">51.38.10.20</text>
  <rect x="250" y="86" width="160" height="42" rx="8" fill="#1b2130" stroke="#8f7bff"/>
  <text x="330" y="104" fill="#8f7bff" font-size="11" text-anchor="middle" font-weight="600">INTERNAL IP · you set it</text>
  <text x="330" y="120" fill="#eef0f5" font-size="13" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">10.0.0.5</text>

  <!-- silo app -->
  <rect x="50" y="176" width="410" height="176" rx="10" fill="#0d1017" stroke="#5ef0c0"/>
  <text x="66" y="200" fill="#eef0f5" font-size="14" font-weight="600">silo app</text>
  <text x="444" y="200" fill="#5ef0c0" font-size="12" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, monospace">cluster IP 10.64.1.7</text>
  <text x="66" y="220" fill="#aab0bd" font-size="12" font-family="'IBM Plex Mono', ui-monospace, monospace">app.payments.kevaso</text>
  <text x="66" y="250" fill="#aab0bd" font-size="11" font-weight="600">PORT</text>
  <text x="140" y="250" fill="#aab0bd" font-size="11" font-weight="600">ASKS FOR</text>
  <text x="290" y="250" fill="#aab0bd" font-size="11" font-weight="600">REACHED AT</text>
  <path d="M66 258H444" stroke="#2a3040"/>
  <g font-size="12.5" font-family="'IBM Plex Mono', ui-monospace, monospace">
    <text x="66" y="280" fill="#eef0f5">9000</text>
    <text x="140" y="280" fill="#aab0bd">nothing</text>
    <text x="290" y="280" fill="#5ef0c0">10.64.1.7:9000</text>
    <text x="66" y="306" fill="#eef0f5">9090</text>
    <text x="140" y="306" fill="#aab0bd">hostPort: internal</text>
    <text x="290" y="306" fill="#8f7bff">10.0.0.5:9090</text>
    <text x="66" y="332" fill="#eef0f5">443</text>
    <text x="140" y="332" fill="#aab0bd">hostPort: external</text>
    <text x="290" y="332" fill="#f2b45a">51.38.10.20:443</text>
  </g>

  <!-- silo db -->
  <rect x="50" y="368" width="410" height="66" rx="10" fill="#0d1017" stroke="#5ef0c0"/>
  <text x="66" y="392" fill="#eef0f5" font-size="14" font-weight="600">silo db</text>
  <text x="444" y="392" fill="#5ef0c0" font-size="12" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, monospace">cluster IP 10.64.1.8</text>
  <text x="66" y="416" fill="#aab0bd" font-size="12">port 5432 asks for nothing: only silos it allows can reach it</text>

  <text x="50" y="476" fill="#aab0bd" font-size="12">silos here get a cluster IP from</text>
  <text x="252" y="476" fill="#5ef0c0" font-size="12" font-family="'IBM Plex Mono', ui-monospace, monospace">10.64.1.0/24</text>

  <!-- host 2 -->
  <rect x="520" y="100" width="430" height="400" rx="12" fill="#141822" stroke="#2a3040"/>
  <text x="540" y="158" fill="#eef0f5" font-size="15" font-weight="600">host home-1</text>
  <rect x="740" y="86" width="160" height="42" rx="8" fill="#1b2130" stroke="#8f7bff"/>
  <text x="820" y="104" fill="#8f7bff" font-size="11" text-anchor="middle" font-weight="600">INTERNAL IP · you set it</text>
  <text x="820" y="120" fill="#eef0f5" font-size="13" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace">192.168.1.40</text>
  <rect x="560" y="86" width="160" height="42" rx="8" fill="#141822" stroke="#3a4152" stroke-dasharray="5 4"/>
  <text x="640" y="104" fill="#737a88" font-size="11" text-anchor="middle" font-weight="600">EXTERNAL IP</text>
  <text x="640" y="120" fill="#737a88" font-size="12" text-anchor="middle">none: behind NAT</text>

  <rect x="540" y="176" width="390" height="124" rx="10" fill="#0d1017" stroke="#5ef0c0"/>
  <text x="556" y="200" fill="#eef0f5" font-size="14" font-weight="600">silo worker</text>
  <text x="914" y="200" fill="#5ef0c0" font-size="12" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, monospace">cluster IP 10.64.2.4</text>
  <text x="556" y="220" fill="#aab0bd" font-size="12" font-family="'IBM Plex Mono', ui-monospace, monospace">worker.payments.kevaso</text>
  <text x="556" y="250" fill="#aab0bd" font-size="12">Reaches <tspan fill="#eef0f5" font-family="'IBM Plex Mono', ui-monospace, monospace">db.payments.kevaso:5432</tspan></text>
  <text x="556" y="270" fill="#aab0bd" font-size="12">because db lists it in <tspan fill="#eef0f5" font-family="'IBM Plex Mono', ui-monospace, monospace">allowFrom</tspan>.</text>
  <text x="556" y="290" fill="#aab0bd" font-size="12">A port asking for <tspan fill="#eef0f5" font-family="'IBM Plex Mono', ui-monospace, monospace">hostPort: external</tspan> can't land here.</text>

  <text x="540" y="476" fill="#aab0bd" font-size="12">silos here get a cluster IP from</text>
  <text x="742" y="476" fill="#5ef0c0" font-size="12" font-family="'IBM Plex Mono', ui-monospace, monospace">10.64.2.0/24</text>

  <!-- silo to silo -->
  <path d="M540 322C500 350 500 396 462 400" stroke="#5ef0c0" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#am)"/>
  <text x="600" y="336" fill="#5ef0c0" font-size="12">silo to silo, by name</text>

  <!-- mesh -->
  <rect x="30" y="520" width="920" height="52" rx="10" fill="#141822" stroke="#2a3040"/>
  <text x="50" y="543" fill="#eef0f5" font-size="13" font-weight="600">mesh (WireGuard) · Kevaso sets it</text>
  <text x="50" y="561" fill="#aab0bd" font-size="12">Carries silo-to-silo traffic between hosts, encrypted. Silos never see it, and no port opens on it.</text>
  <text x="930" y="543" fill="#aab0bd" font-size="12" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, monospace">mesh IP 10.63.0.1  ⇄  mesh IP 10.63.0.2</text>
  <path d="M255 500V520M735 500V520" stroke="#3a4152" stroke-width="1.6"/>

  <!-- legend -->
  <g font-size="12">
    <rect x="30" y="596" width="12" height="12" rx="3" fill="#f2b45a"/><text x="50" y="607" fill="#aab0bd">external IP: reachable from outside the host's network</text>
    <rect x="390" y="596" width="12" height="12" rx="3" fill="#8f7bff"/><text x="410" y="607" fill="#aab0bd">internal IP: the host's own network</text>
    <rect x="660" y="596" width="12" height="12" rx="3" fill="#5ef0c0"/><text x="680" y="607" fill="#aab0bd">cluster IP: inside the cluster only</text>
  </g>
</svg>
